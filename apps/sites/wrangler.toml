name = "voice-notes-sites"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
# Домен (sites.<BASE_DOMAIN>) підключає CI: wrangler deploy --domain (див. README, «CI/CD»)

[observability]
enabled = true

# Файли сайтів кладе агент командою `publish` (токен R2 лише на цей бакет); воркер їх тільки віддає.
[[r2_buckets]]
binding = "SITES"
bucket_name = "agent-sites"

# Публічний хост (share.<BASE_DOMAIN>, домен підключає CI): той самий код, окремий бакет, без Access (змінна PUBLIC, див. docs/agent-integrations.md).
# Прив'язки не успадковуються, тому бакет вказано явно: приватні сайти не можуть потрапити сюди помилкою.
[env.public]
name = "voice-notes-sites-public"
workers_dev = false
preview_urls = false

[env.public.vars]
PUBLIC = "1"

[[env.public.r2_buckets]]
binding = "SITES"
bucket_name = "agent-sites-public"
