name = "voice-notes-agent"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "agent.example.com", custom_domain = true }]

# payload/*.md і *.sh підключаються до коду як текст (їх воркер розкладає в контейнер)
rules = [{ type = "Text", globs = ["**/*.md", "**/*.sh"], fallthrough = true }]

[ai]
binding = "AI" # Whisper для голосових у Telegram

[vars]
# Репозиторії, які бот розпізнає з вільної мови («працюй над нашим ботом»): repo = owner/name, about = як власник його називає.
AGENT_REPOS = '''[{"repo":"vichnyi-myzuka/voice-notes-worker","about":"The owner's own project (a Cloudflare Workers monorepo): the voice-notes Telegram bot and the coding-agent platform the agent itself runs on. Pick it only when the owner explicitly refers to this project or its code: \"our bot\", \"our repository\", \"this project\", \"the notes bot\", \"the agent bot\", \"work on yourself\", \"your own code\", or names its parts (notes, session, container, AGENTS.md, README). Not for building new standalone things."}]'''

[observability]
enabled = true

[observability.logs]
invocation_logs = false # інтерфейс OpenCode пінгує щосекунди, подій забагато; console.log лишається

# Сесія агента = Durable Object, що керує власним контейнером з OpenCode.
[[containers]]
class_name = "AgentSession"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./container/Dockerfile"

# SSH у контейнер: `npx wrangler containers ssh <INSTANCE_ID>` (інстанс має працювати; id: `wrangler containers instances`).
# Публічний ключ не секрет. Потрібен лише ssh-ed25519.
[[containers.authorized_keys]]
name = "owner"
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAO9Obaqo+AAXqqVhu7/Jv9mUE2hGRX95tZ+mHj9dbYY"

[[durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"

[exports.AgentSession]
type = "durable-object"
storage = "sqlite"
