name = "voice-notes-agent"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "agent.example.com", custom_domain = true }]

[ai]
binding = "AI" # Whisper для голосових у Telegram

[observability]
enabled = true

[observability.logs]
invocation_logs = false # інтерфейс OpenCode пінгує щосекунди, подій забагато; console.log лишається

# Сесія агента = Durable Object, що керує власним контейнером з OpenCode.
[[containers]]
class_name = "AgentSession"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./container/Dockerfile"

# SSH у контейнер: `npx wrangler containers ssh <INSTANCE_ID>` (інстанс має працювати; id: `wrangler containers instances`).
# Публічний ключ не секрет. Потрібен лише ssh-ed25519.
[[containers.authorized_keys]]
name = "owner"
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAO9Obaqo+AAXqqVhu7/Jv9mUE2hGRX95tZ+mHj9dbYY"

[[durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"

[exports.AgentSession]
type = "durable-object"
storage = "sqlite"
